name: Build

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: Memify-windows
            exe: dist/Memify.exe
          - os: ubuntu-latest
            artifact: Memify-linux
            exe: dist/Memify
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The equalizer needs the actual libVLC runtime, not just the
      # python-vlc pip package (a thin ctypes wrapper) — memify.spec bundles
      # whatever gets installed here into the exe, so it works on machines
      # that don't have VLC installed themselves. See memify.spec's
      # _find_vlc_files() for exactly which files it looks for afterward.
      - name: Install VLC (Windows)
        if: runner.os == 'Windows'
        run: choco install vlc -y --no-progress

      - name: Install VLC (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y vlc libvlc-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build
        run: pyinstaller memify.spec

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.exe }}
